[package]
name = "fforge-core"
version = "0.2.0"
edition.workspace = true
description = "Core engines for the Football Forge game."
license = "Apache-2.0"

[features]
# Gates this crate's own pooled sanity bands (whole-season goal, injury and
# card rates): multi-seed runs too slow for the default `cargo test`. The
# harness guards have their own `slow-tests` feature in `fforge-harness`.
slow-tests = []

[dependencies]
fforge-domain = { path = "../fforge-domain", version = "0.2.0" }
serde.workspace = true
serde_json.workspace = true